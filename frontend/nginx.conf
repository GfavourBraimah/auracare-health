worker_processes auto;

# The base image's default nginx.conf normally points `pid` at a location
# writable by the non-root "nginx" user (e.g. /tmp/nginx.pid) specifically
# because the default /run/nginx.pid requires root to create. Since this
# file replaces that default config wholesale, that override must be
# restated here or the master process fails with "Permission denied".
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker Compose's embedded DNS server (127.0.0.11) resolves service
    # names to container IPs. nginx normally resolves proxy_pass hostnames
    # ONCE at config-load time and never retries, so if this container
    # starts before an upstream's DNS entry/IP is ready, it fails to boot
    # entirely with "host not found in upstream". Setting a resolver and
    # using a variable in proxy_pass (below) makes nginx resolve lazily on
    # each request instead, so startup order between containers doesn't
    # matter.
    resolver 127.0.0.11 valid=10s;

    # Static assets - serve directly, fall back to index.html for any
    # unmatched path so client-side (SPA) routing works correctly.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API calls to the backend services. The frontend code
    # only ever calls same-origin relative paths; nginx routes them to the
    # correct upstream container by hostname (docker-compose service name).
    #
    # Note: these location patterns deliberately have NO trailing slash so
    # they match both the exact prefix (e.g. /api/patients) and any nested
    # path (e.g. /api/patients/42). Because proxy_pass below has no URI
    # component (just scheme + host), nginx forwards the original request
    # URI unchanged - which keeps the /api/<service> prefix intact, matching
    # how each backend mounts its own routes.
    location /api/patients {
      set $patient_upstream http://patient-service:8000;
      proxy_pass $patient_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/appointments {
      set $appointment_upstream http://appointment-service:3000;
      proxy_pass $appointment_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/billing {
      set $billing_upstream http://billing-service:8000;
      proxy_pass $billing_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /index.html;
  }
}
